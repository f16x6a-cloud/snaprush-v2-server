<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d1a"><title>SNAP RUSH | كاميرا اللاعب</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="shell device">
<header class="phone-heading"><div class="logo"><span class="logo-mark">📸</span><div class="wordmark" dir="ltr"><span class="top">SNAP</span><span class="bottom">RUSH</span></div></div><p>صوّر أسرع من الجميع!</p></header>
<div class="card" id="joining"><div class="eyebrow center">YOUR PLAYER SLOT</div><div class="player-label" id="playerNumber">CONNECTING</div><div class="status-card" id="playerStatus">جاري الدخول تلقائيًا...</div>
<div class="frame"><div class="screen-title">CHALLENGE SCREEN</div><div class="target" id="target">WAITING...</div><div class="muted" id="roundStatus">بانتظار باقي اللاعبين</div><div class="timer" id="timer"></div></div>
<button id="ready" class="btn btn-mint wide" style="margin-top:20px">✓ أنا جاهز — READY</button>
<button id="openCamera" class="btn btn-gold wide" style="margin-top:17px">📸 افتح الكاميرا الأمامية</button>
<section id="cameraSection" class="hide" style="margin-top:20px"><div id="cameraBox" class="camera-wrap selfie"><video id="video" autoplay muted playsinline></video><span class="cam-corner tl"></span><span class="cam-corner tr"></span><span class="cam-corner bl"></span><span class="cam-corner br"></span></div><div class="camera-controls"><button id="snap" class="btn btn-pink" disabled>● التقط وأرسل</button><button id="flip" class="btn btn-outline">⇄ تبديل</button></div><div class="muted small center" style="margin-top:12px">تُعرض الصورة فوق شخصيتك بمجرد وصولها للسيرفر، ثم يبدأ تحليلها.</div></section>
<input id="fallback" type="file" accept="image/*" capture="user" hidden>
<div id="myPhoto" class="photo-list"></div>
<div class="divider"></div><button id="leave" class="btn btn-danger wide">↪ خروج من الغرفة</button><div id="toast" class="toast" role="status" aria-live="polite"></div>
</div><p class="footer">لا تحتاج اسمًا ولا حسابًا • الرقم مرتبط بالـQR الخاص بك</p></div>
<script src="/static/player.js" defer></script></body></html>
